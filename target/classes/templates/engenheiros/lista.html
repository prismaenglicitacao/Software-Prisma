<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Engenheiros')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: topo}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Engenheiros</h1>
            <p class="text-body-secondary mb-0">Cadastro e manutenção dos engenheiros por área.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/engenheiros/novo}">Novo Engenheiro</a>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(engenheiros)}" class="p-4 text-center text-body-secondary">
                Nenhum engenheiro cadastrado.
            </div>

            <div th:unless="${#lists.isEmpty(engenheiros)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>Área</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="engenheiro : ${engenheiros}">
                        <td th:text="${engenheiro.nome}">Nome</td>
                        <td>
                            <span class="badge rounded-pill text-bg-secondary"
                                  th:text="${engenheiro.area == T(br.com.softwareprisma.licitacao.domain.enums.Area).ILUMINACAO ? 'Iluminacao' : 'Pavimentacao'}">
                                Área
                            </span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/engenheiros/{id}/editar(id=${engenheiro.id})}">
                                    Editar
                                </a>
                                <form th:action="@{/engenheiros/{id}/excluir(id=${engenheiro.id})}" method="post"
                                      onsubmit="return confirm('Deseja realmente excluir este engenheiro?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
