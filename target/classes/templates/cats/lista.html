<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('CATs')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: topo}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">CATs</h1>
            <p class="text-body-secondary mb-0">Cadastro e manutenção das CATs vinculadas aos engenheiros.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/cats/nova}">Nova CAT</a>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(cats)}" class="p-4 text-center text-body-secondary">
                Nenhuma CAT cadastrada.
            </div>

            <div th:unless="${#lists.isEmpty(cats)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>Número</th>
                        <th>Engenheiro</th>
                        <th>Município</th>
                        <th>Itens</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cat : ${cats}">
                        <td th:text="${cat.nome}">CAT</td>
                        <td th:text="${cat.numeroCat}">000</td>
                        <td th:text="${cat.engenheiro.nome}">Engenheiro</td>
                        <td th:text="${cat.municipio}">Município</td>
                        <td>
                            <span class="badge text-bg-light border"
                                  th:text="${#lists.size(cat.itens)} + ' item(ns)'">
                                0 item(ns)
                            </span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{/cats/{id}/itens(id=${cat.id})}">
                                    Itens
                                </a>
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/cats/{id}/editar(id=${cat.id})}">
                                    Editar
                                </a>
                                <form th:action="@{/cats/{id}/excluir(id=${cat.id})}" method="post"
                                      onsubmit="return confirm('Deseja realmente excluir esta CAT?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
