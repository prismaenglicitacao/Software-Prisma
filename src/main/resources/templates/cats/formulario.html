<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${tituloPagina})}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: topo}"></nav>
<div th:replace="~{fragments/layout :: modal}"></div>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-7">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1" th:text="${tituloPagina}">Formulário</h1>
                    <p class="text-body-secondary mb-0">Informe os dados da CAT e o engenheiro responsável.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/cats}">Voltar</a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{${acaoFormulario}}" th:object="${catForm}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="engenheiroId" class="form-label">Engenheiro</label>
                            <select id="engenheiroId" class="form-select" th:field="*{engenheiroId}">
                                <option value="">Selecione</option>
                                <option th:each="engenheiro : ${engenheiros}"
                                        th:value="${engenheiro.id}"
                                        th:text="${engenheiro.nome}">
                                    Engenheiro
                                </option>
                            </select>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('engenheiroId')}"
                                 th:errors="*{engenheiroId}"></div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-7">
                                <label for="nome" class="form-label">Nome</label>
                                <input id="nome" type="text" class="form-control"
                                       th:field="*{nome}" placeholder="Ex.: Camaragibe">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('nome')}"
                                     th:errors="*{nome}"></div>
                            </div>

                            <div class="col-md-5">
                                <label for="numeroCat" class="form-label">Número da CAT</label>
                                <input id="numeroCat" type="text" class="form-control"
                                       th:field="*{numeroCat}" placeholder="Ex.: 123456">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('numeroCat')}"
                                     th:errors="*{numeroCat}"></div>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label for="municipio" class="form-label">Município</label>
                            <input id="municipio" type="text" class="form-control"
                                   th:field="*{municipio}" placeholder="Município da obra">
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('municipio')}"
                                 th:errors="*{municipio}"></div>
                        </div>

                        <div class="mt-3 mb-4">
                            <label for="observacoes" class="form-label">Observações</label>
                            <textarea id="observacoes" class="form-control" rows="4"
                                      th:field="*{observacoes}"
                                      placeholder="Informações complementares da CAT"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/cats}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
