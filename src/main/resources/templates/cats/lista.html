<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('CATs')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: topo}"></nav>
<div th:replace="~{fragments/layout :: modal}"></div>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h4 mb-1">CATs</h1>
            <p class="text-body-secondary mb-0">Cadastro e manutenção das CATs vinculadas aos engenheiros.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/cats/nova}">
            <i class="bi bi-plus-lg me-2"></i>Nova CAT
        </a>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body p-3">
            <form th:action="@{/cats}" method="get" class="row g-2">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control" name="filtro" 
                               th:value="${filtro}" placeholder="Pesquisar engenheiro...">
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search me-2"></i>Pesquisar
                    </button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/cats}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-x-lg me-2"></i>Limpar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#maps.isEmpty(catsPorEngenheiro)}" class="p-4 text-center text-body-secondary">
                <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                Nenhuma CAT cadastrada.
            </div>

            <div th:unless="${#maps.isEmpty(catsPorEngenheiro)}" class="accordion" id="accordionCats">
                <div th:each="entry, stat : ${catsPorEngenheiro}" class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" 
                                data-bs-toggle="collapse" 
                                th:attr="data-bs-target='#collapse-' + ${stat.index}"
                                th:aria-controls="'collapse-' + ${stat.index}">
                            <div class="d-flex justify-content-between w-100 me-3">
                                <span class="d-flex align-items-center gap-2">
                                    <i class="bi bi-person-badge"></i>
                                    <span th:text="${entry.key.nome}">Engenheiro</span>
                                </span>
                                <span class="text-body-secondary">
                                    <span th:text="${entry.value.totalCats} + ' CAT(s)'">0 CAT(s)</span>
                                    <span class="mx-2">•</span>
                                    <span th:text="${entry.value.totalItens} + ' item(ns)'">0 item(ns)</span>
                                </span>
                            </div>
                        </button>
                    </h2>
                    <div th:id="'collapse-' + ${stat.index}" 
                         class="accordion-collapse collapse" 
                         data-bs-parent="#accordionCats">
                        <div class="accordion-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Número</th>
                                        <th>Município</th>
                                        <th>Itens</th>
                                        <th class="text-end">Ações</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="cat : ${entry.value.cats}">
                                        <td th:text="${cat.nome}">CAT</td>
                                        <td th:text="${cat.numeroCat}">000</td>
                                        <td th:text="${cat.municipio}">Município</td>
                                        <td>
                                            <span class="badge text-bg-light border"
                                                  th:text="${#lists.size(cat.itens)} + ' item(ns)'">
                                                0 item(ns)
                                            </span>
                                        </td>
                                        <td class="text-end">
                                            <div class="d-inline-flex gap-1">
                                                <a class="btn btn-sm btn-outline-secondary"
                                                   th:href="@{/cats/{id}/itens(id=${cat.id})}"
                                                   title="Itens">
                                                    <i class="bi bi-list-ul"></i>
                                                </a>
                                                <a class="btn btn-sm btn-outline-primary"
                                                   th:href="@{/cats/{id}/editar(id=${cat.id})}"
                                                   title="Editar">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <form th:action="@{/cats/{id}/excluir(id=${cat.id})}" method="post"
                                                      onsubmit="return confirm('Deseja realmente excluir esta CAT?');">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
