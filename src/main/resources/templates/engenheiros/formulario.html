<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${tituloPagina})}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: topo}"></nav>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1" th:text="${tituloPagina}">Formulario</h1>
                    <p class="text-body-secondary mb-0">Informe o nome e a area do engenheiro.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/engenheiros}">Voltar</a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{${acaoFormulario}}" th:object="${engenheiro}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input id="nome" type="text" class="form-control"
                                   th:field="*{nome}" placeholder="Nome do engenheiro">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="area" class="form-label">Área</label>
                            <select id="area" class="form-select" th:field="*{area}">
                                <option value="">Selecione</option>
                                <option th:each="area : ${areas}" th:value="${area}"
                                        th:text="${area == T(br.com.softwareprisma.licitacao.domain.enums.Area).ELETRICA ? 'Elétrica' : 'Civil'}">
                                    Area
                                </option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('area')}" th:errors="*{area}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/engenheiros}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
