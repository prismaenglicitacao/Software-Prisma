<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Nova Análise')}"></head>

<body class="bg-body-tertiary">
    <nav th:replace="~{fragments/layout :: topo}"></nav>
    <div th:replace="~{fragments/layout :: modal}"></div>

    <main class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-12 col-xl-10">
                <div class="mb-4">
                    <h1 class="h3 mb-1">Nova Análise</h1>
                    <p class="text-body-secondary mb-0">
                        Selecione a área e informe os itens exigidos pelo edital.
                    </p>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-body p-4">
                        <form th:action="@{/analises}" th:object="${novaAnaliseForm}" method="post" novalidate>
                            <div class="mb-4">
                                <label for="area" class="form-label">Área</label>
                                <select id="area" class="form-select" th:field="*{area}">
                                    <option value="">Selecione</option>
                                    <option th:each="area : ${areas}" th:value="${area}"
                                        th:text="${area == T(br.com.softwareprisma.licitacao.domain.enums.Area).ELETRICA ? 'Elétrica' : 'Civil'}">
                                        Área
                                    </option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('area')}"
                                    th:errors="*{area}"></div>
                            </div>

                            <div class="card shadow-sm mb-4">
                                <div class="card-header bg-white">
                                    <h2 class="h5 mb-0">Itens do Edital</h2>
                                </div>
                                <div class="card-body">
                                    <!-- Itens utilizados recentemente -->
                                    <div class="mb-4" id="itensRecentesSection" style="display: none;">
                                        <h3 class="h6 mb-2">Itens utilizados recentemente</h3>
                                        <div id="itensRecentes"></div>
                                    </div>

                                    <div class="row g-3 align-items-end">
                                        <div class="col-lg-5">
                                            <label for="novaItemDescricao" class="form-label">Descrição</label>
                                            <input id="novaItemDescricao" type="text" class="form-control"
                                                placeholder="Ex.: Luminária LED 90-120W" autocomplete="off">
                                            <div id="sugestoesLista"
                                                class="list-group position-absolute w-100 shadow-sm mt-1"
                                                style="display: none; max-height: 300px; overflow-y: auto;">
                                            </div>
                                        </div>

                                        <div class="col-lg-2">
                                            <label for="novaItemQuantidade" class="form-label">Quantidade</label>
                                            <input id="novaItemQuantidade" type="number" step="0.01" min="0.01"
                                                class="form-control" placeholder="0">
                                        </div>

                                        <div class="col-lg-3">
                                            <label for="novaItemUnidade" class="form-label">Unidade</label>
                                            <select id="novaItemUnidade" class="form-select">
                                             <option value="">Selecione</option>
                            <option value="UD">UD</option>
                            <option value="UN">UN</option>
                            <option value="M">M</option>
                            <option value="M²">M²</option>
                            <option value="M³">M³</option>
                            <option value="KM">KM</option>
                            <option value="KG">KG</option>
                            <option value="TON">TON</option>
                            <option value="L">L</option>
                            <option value="ML">ML</option>
                            <option value="H">H</option>
                            <option value="DIA">DIA</option>
                            <option value="DIA/ANO">DIA/ANO</option>
                            <option value="H/MÊS">H/MÊS</option>
                            <option value="T/MÊS">T/MÊS</option>
                            <option value="EQUIPE">EQUIPE</option>
                            <option value="MÊS">MÊS</option>
                            <option value="CJ">CJ</option>
                            <option value="CHP">CHP</option>
                            <option value="CHI">CHI</option>
                            <option value="PAR">PAR</option>
                            <option value="CX">CX</option>
                            <option value="PCT">PCT</option>
                                            </select>
                                        </div>

                                        <div class="col-lg-2 d-grid">
                                            <button type="button" class="btn btn-primary"
                                                id="botaoAdicionarItem">Adicionar</button>
                                        </div>
                                    </div>

                                    <div id="novoItemErro" class="text-danger small mt-2"></div>

                                    <div class="mt-4">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <h3 class="h6 mb-0">Lista</h3>
                                            <span id="itensCount" class="text-body-secondary">Nenhum item
                                                adicionado</span>
                                        </div>
                                        <div id="itensLista" class="list-group"></div>
                                    </div>

                                    <div id="hiddenItensInputs"></div>

                                    <div class="text-danger small mt-2" th:if="${#fields.hasErrors('itens')}"
                                        th:errors="*{itens}"></div>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg" id="analisarBtn"
                                    disabled>ANALISAR</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const itens = [];
        const itensLista = document.getElementById('itensLista');
        const itensCount = document.getElementById('itensCount');
        const novoItemErro = document.getElementById('novoItemErro');
        const hiddenItensInputs = document.getElementById('hiddenItensInputs');
        const analisarBtn = document.getElementById('analisarBtn');
        const areaSelect = document.getElementById('area');
        const descricaoInput = document.getElementById('novaItemDescricao');
        const sugestoesLista = document.getElementById('sugestoesLista');
        const itensRecentesSection = document.getElementById('itensRecentesSection');
        const itensRecentes = document.getElementById('itensRecentes');
        let debounceTimer;

        function montarUrlItens(path, termo) {
            const params = new URLSearchParams();
            if (termo) {
                params.set('termo', termo);
            }
            const area = areaSelect.value.trim();
            if (area) {
                params.set('area', area);
            }
            const query = params.toString();
            return query ? `${path}?${query}` : path;
        }

        // Carregar itens recentes ao iniciar
        async function carregarItensRecentes() {
            try {
                const response = await fetch(montarUrlItens('/api/itens/recentes'));
                const data = await response.json();

                if (data.length > 0) {
                    itensRecentesSection.style.display = 'block';
                    itensRecentes.innerHTML = '';
                    data.forEach(item => {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'btn btn-sm btn-outline-primary';
                        button.dataset.descricao = item.descricao;
                        button.dataset.unidade = item.unidade;
                        button.textContent = `${item.descricao} (${item.unidade})`;
                        button.addEventListener('click', () => {
                            selecionarItemRecente(button.dataset.descricao, button.dataset.unidade);
                        });
                        itensRecentes.appendChild(button);
                    });
                } else {
                    itensRecentesSection.style.display = 'none';
                    itensRecentes.innerHTML = '';
                }
            } catch (error) {
                console.error('Erro ao carregar itens recentes:', error);
            }
        }

        function selecionarItemRecente(descricao, unidade) {
            descricaoInput.value = descricao;
            document.getElementById('novaItemUnidade').value = unidade;
            document.getElementById('novaItemQuantidade').focus();
        }

        // Autocomplete
        descricaoInput.addEventListener('input', (e) => {
            const termo = e.target.value.trim();

            clearTimeout(debounceTimer);

            if (termo.length < 2) {
                sugestoesLista.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const response = await fetch(montarUrlItens('/api/itens/sugestoes', termo));
                    const data = await response.json();

                    // Filtrar itens já adicionados à análise
                    const itensJaAdicionados = new Set(
                        itens.map(item => `${item.descricao}|${item.unidade}`)
                    );
                    const dataFiltrada = data.filter(item => 
                        !itensJaAdicionados.has(`${item.descricao}|${item.unidade}`)
                    );

                    if (dataFiltrada.length > 0) {
                        sugestoesLista.innerHTML = '';
                        dataFiltrada.forEach(item => {
                            const button = document.createElement('button');
                            button.type = 'button';
                            button.className = 'list-group-item list-group-item-action';
                            button.dataset.descricao = item.descricao;
                            button.dataset.unidade = item.unidade;
                            button.append(document.createTextNode(`${item.descricao} `));

                            const unidadeSpan = document.createElement('span');
                            unidadeSpan.className = 'text-body-secondary';
                            unidadeSpan.textContent = item.unidade;
                            button.appendChild(unidadeSpan);

                            if (item.quantidadeDisponivel != null) {
                                const qtdSpan = document.createElement('span');
                                qtdSpan.className = 'text-body-secondary ms-2';
                                qtdSpan.textContent = 'Qtd: ' + item.quantidadeDisponivel;
                                button.appendChild(qtdSpan);
                            }

                            button.addEventListener('click', () => {
                                selecionarSugestao(button.dataset.descricao, button.dataset.unidade);
                            });
                            sugestoesLista.appendChild(button);
                        });
                        sugestoesLista.style.display = 'block';
                    } else {
                        sugestoesLista.style.display = 'none';
                    }
                } catch (error) {
                    console.error('Erro ao buscar sugestões:', error);
                }
            }, 300);
        });

        function selecionarSugestao(descricao, unidade) {
            descricaoInput.value = descricao;
            document.getElementById('novaItemUnidade').value = unidade;
            sugestoesLista.style.display = 'none';
            document.getElementById('novaItemQuantidade').focus();
        }

        // Fechar sugestões ao clicar fora
        document.addEventListener('click', (e) => {
            if (!descricaoInput.contains(e.target) && !sugestoesLista.contains(e.target)) {
                sugestoesLista.style.display = 'none';
            }
        });

        areaSelect.addEventListener('change', () => {
            sugestoesLista.style.display = 'none';
            carregarItensRecentes();
        });

        function atualizarItens() {
            itensLista.innerHTML = '';
            hiddenItensInputs.innerHTML = '';

            if (itens.length === 0) {
                itensCount.textContent = 'Nenhum item adicionado';
                analisarBtn.disabled = true;
                return;
            }

            itensCount.textContent = `${itens.length} item(s) adicionados`;
            analisarBtn.disabled = false;

            itens.forEach((item, index) => {
                const itemElement = document.createElement('div');
                itemElement.className = 'list-group-item d-flex justify-content-between align-items-center gap-3';
                itemElement.innerHTML = `
                    <div>
                        <div class="fw-semibold text-success">✓ ${item.descricao}</div>
                        <div class="text-body-secondary mt-1">${item.quantidade} ${item.unidade}</div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-danger">Remover</button>
                `;
                const removeButton = itemElement.querySelector('button');
                removeButton.addEventListener('click', () => {
                    itens.splice(index, 1);
                    atualizarItens();
                });
                itensLista.appendChild(itemElement);

                const descricaoInputHidden = document.createElement('input');
                descricaoInputHidden.type = 'hidden';
                descricaoInputHidden.name = `itens[${index}].descricao`;
                descricaoInputHidden.value = item.descricao;
                hiddenItensInputs.appendChild(descricaoInputHidden);

                const quantidadeInput = document.createElement('input');
                quantidadeInput.type = 'hidden';
                quantidadeInput.name = `itens[${index}].quantidade`;
                quantidadeInput.value = item.quantidadeNormalized;
                hiddenItensInputs.appendChild(quantidadeInput);

                const unidadeInput = document.createElement('input');
                unidadeInput.type = 'hidden';
                unidadeInput.name = `itens[${index}].unidade`;
                unidadeInput.value = item.unidade;
                hiddenItensInputs.appendChild(unidadeInput);
            });
        }

        document.getElementById('botaoAdicionarItem').addEventListener('click', () => {
            novoItemErro.textContent = '';

            const descricao = descricaoInput.value.trim();
            const quantidadeRaw = document.getElementById('novaItemQuantidade').value.trim();
            const unidade = document.getElementById('novaItemUnidade').value.trim();

            if (!descricao) {
                novoItemErro.textContent = 'Informe a descrição do item.';
                return;
            }

            if (!quantidadeRaw) {
                novoItemErro.textContent = 'Informe a quantidade do item.';
                return;
            }

            const quantidade = parseFloat(quantidadeRaw.replace(',', '.'));
            if (Number.isNaN(quantidade) || quantidade <= 0) {
                novoItemErro.textContent = 'Informe uma quantidade maior que zero.';
                return;
            }

            if (!unidade) {
                novoItemErro.textContent = 'Informe a unidade do item.';
                return;
            }

            itens.push({
                descricao,
                quantidade: quantidadeRaw,
                quantidadeNormalized: quantidade.toString(),
                unidade
            });

            descricaoInput.value = '';
            document.getElementById('novaItemQuantidade').value = '';
            document.getElementById('novaItemUnidade').value = '';
            atualizarItens();
        });

        carregarItensRecentes();
        atualizarItens();
    </script>
    <script th:replace="~{fragments/layout :: scripts}"></script>
</body>

</html>
