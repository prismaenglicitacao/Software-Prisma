<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nova Análise')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: topo}"></nav>
<div th:replace="~{fragments/layout :: modal}"></div>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h1 class="h3 mb-1">Nova Análise</h1>
            <p class="text-body-secondary mb-0">
                Área:
                <strong th:text="${analise.area == T(br.com.softwareprisma.licitacao.domain.enums.Area).ELETRICA ? 'Elétrica' : 'Civil'}">
                    Elétrica
                </strong>
            </p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/analises/nova}">Nova análise</a>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">
            <h2 class="h5 mb-0" th:text="${modoEdicao} ? 'Editar Item' : 'Adicionar Item'">Adicionar Item</h2>
        </div>
        <div class="card-body">
            <!-- Itens utilizados recentemente -->
            <div class="mb-4" id="itensRecentesSection" style="display: none;">
                <h3 class="h6 mb-2">Itens utilizados recentemente</h3>
                <div id="itensRecentes" class="d-flex flex-wrap gap-2"></div>
            </div>

            <form th:action="@{${acaoFormulario}}" th:object="${itemForm}" method="post" novalidate>
                <div class="row g-3 align-items-end">
                    <div class="col-lg-6">
                        <label for="descricao" class="form-label">Descrição</label>
                        <input id="descricao" type="text" class="form-control"
                               th:field="*{descricao}" placeholder="Ex.: Luminária LED 90-120W" autocomplete="off">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('descricao')}"
                             th:errors="*{descricao}"></div>
                    </div>

                    <div class="col-lg-3">
                        <label for="quantidade" class="form-label">Quantidade</label>
                        <input id="quantidade" type="number" step="0.01" min="0.01" class="form-control"
                               th:field="*{quantidade}" placeholder="0">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('quantidade')}"
                             th:errors="*{quantidade}"></div>
                    </div>

                    <div class="col-lg-3">
                        <label for="unidade" class="form-label">Unidade</label>
                        <select id="unidade" class="form-select" th:field="*{unidade}">
                            <option value="">Selecione</option>
                            <option value="UD">UD</option>
                            <option value="UN">UN</option>
                            <option value="M">M</option>
                            <option value="M²">M²</option>
                            <option value="M³">M³</option>
                            <option value="KM">KM</option>
                            <option value="KG">KG</option>
                            <option value="TON">TON</option>
                            <option value="L">L</option>
                            <option value="ML">ML</option>
                            <option value="H">H</option>
                            <option value="DIA">DIA</option>
                            <option value="DIA/ANO">DIA/ANO</option>
                            <option value="H/MÊS">H/MÊS</option>
                            <option value="T/MÊS">T/MÊS</option>
                            <option value="T/MÊS">T/MÊS</option>
                            <option value="M3xKM">M³xKM</option>
                            <option value="MÊS">MÊS</option>
                            <option value="CJ">CJ</option>
                            <option value="CHP">CHP</option>
                            <option value="CHI">CHI</option>
                            <option value="PAR">PAR</option>
                            <option value="CX">CX</option>
                            <option value="PCT">PCT</option>
                        </select>
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('unidade')}"
                             th:errors="*{unidade}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary"
                            th:text="${modoEdicao} ? 'Atualizar' : 'Adicionar'">
                        Adicionar
                    </button>
                    <a th:if="${modoEdicao}" class="btn btn-outline-secondary"
                       th:href="@{/analises/{id}(id=${analise.id})}">
                        Cancelar edição
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">
            <h2 class="h5 mb-0">Itens do Edital</h2>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(analise.itens)}" class="p-4 text-center text-body-secondary">
                Nenhum item adicionado. Informe os itens exigidos pelo edital acima.
            </div>

            <div th:unless="${#lists.isEmpty(analise.itens)}" class="list-group list-group-flush">
                <div th:each="item : ${analise.itens}" class="list-group-item">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div>
                            <div class="fw-semibold text-success">
                                &#10003;
                                <span th:text="${item.descricao}">Descrição</span>
                            </div>
                            <div class="text-body-secondary mt-1">
                                <span th:text="${#numbers.formatDecimal(item.quantidade, 1, 'POINT', 2, 'COMMA')}">0</span>
                                <span th:text="${item.unidade}">UND</span>
                            </div>
                        </div>
                        <div class="d-inline-flex gap-2 flex-shrink-0">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/analises/{analiseId}/itens/{itemId}/editar(analiseId=${analise.id}, itemId=${item.id})}">
                                Editar
                            </a>
                            <form th:action="@{/analises/{analiseId}/itens/{itemId}/excluir(analiseId=${analise.id}, itemId=${item.id})}"
                                  method="post"
                                  onsubmit="return confirm('Deseja realmente excluir este item?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <form th:action="@{/analises/{id}/analisar(id=${analise.id})}" method="post">
        <button type="submit" class="btn btn-success btn-lg w-100"
                th:disabled="${#lists.isEmpty(analise.itens)}">
            ANALISAR
        </button>
    </form>
</main>

<script th:inline="javascript">
    const areaAnalise = /*[[${analise.area}]]*/ null;
</script>
<script th:if="${!modoEdicao}">
    const descricaoInput = document.getElementById('descricao');
    const itensRecentesSection = document.getElementById('itensRecentesSection');
    const itensRecentes = document.getElementById('itensRecentes');

    function montarUrlItens(path, termo) {
        const params = new URLSearchParams();
        if (termo) {
            params.set('termo', termo);
        }
        if (areaAnalise) {
            params.set('area', areaAnalise);
        }
        const query = params.toString();
        return query ? path + '?' + query : path;
    }

    // Carregar itens recentes ao iniciar
    async function carregarItensRecentes() {
        try {
            const response = await fetch(montarUrlItens('/api/itens/recentes'));
            const data = await response.json();

            if (data.length > 0) {
                itensRecentesSection.style.display = 'block';
                itensRecentes.innerHTML = '';
                data.forEach(item => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'btn btn-sm btn-outline-primary';
                    button.dataset.descricao = item.descricao;
                    button.dataset.unidade = item.unidade;
                    button.textContent = item.descricao + ' (' + item.unidade + ')';
                    button.addEventListener('click', () => {
                        selecionarItemRecente(button.dataset.descricao, button.dataset.unidade);
                    });
                    itensRecentes.appendChild(button);
                });
            } else {
                itensRecentesSection.style.display = 'none';
            }
        } catch (error) {
            console.error('Erro ao carregar itens recentes:', error);
        }
    }

    function selecionarItemRecente(descricao, unidade) {
        descricaoInput.value = descricao;
        document.getElementById('unidade').value = unidade;
        document.getElementById('quantidade').focus();
    }

    carregarItensRecentes();

    // Inicializar Tom Select para autocomplete
    document.addEventListener('DOMContentLoaded', function() {
        const descricaoSelect = new TomSelect('#descricao', {
            create: false,
            maxItems: 1,
            valueField: 'descricao',
            labelField: 'descricao',
            searchField: 'descricao',
            load: async function(query, callback) {
                if (query.length < 2) {
                    callback();
                    return;
                }

                const params = new URLSearchParams();
                params.set('termo', query);
                if (areaAnalise) {
                    params.set('area', areaAnalise);
                }

                try {
                    const response = await fetch('/api/itens/sugestoes?' + params.toString());
                    const data = await response.json();
                    callback(data);
                } catch (error) {
                    console.error('Erro ao buscar sugestões:', error);
                    callback();
                }
            },
            render: {
                option: function(item, escape) {
                    let html = '<div class="py-2">';
                    html += '<div class="fw-semibold">' + escape(item.descricao) + '</div>';
                    html += '<div class="text-body-secondary small">';
                    html += escape(item.unidade);
                    if (item.quantidadeDisponivel != null) {
                        html += ' • Qtd: ' + escape(item.quantidadeDisponivel);
                    }
                    html += '</div>';
                    html += '</div>';
                    return html;
                },
                item: function(item, escape) {
                    return '<div>' + escape(item.descricao) + '</div>';
                }
            },
            onChange: function(value) {
                const selectedOption = this.options[value];
                if (selectedOption && selectedOption.unidade) {
                    document.getElementById('unidade').value = selectedOption.unidade;
                }
            },
            onDropdownOpen: function() {
                const dropdown = this.dropdown_content;
                const resultsCount = this.options.length;
                if (resultsCount > 0) {
                    const countDiv = document.createElement('div');
                    countDiv.className = 'px-3 py-2 text-body-secondary small border-bottom';
                    countDiv.textContent = `${resultsCount} item(s) encontrado(s)`;
                    dropdown.insertBefore(countDiv, dropdown.firstChild);
                }
            }
        });
    });
</script>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
