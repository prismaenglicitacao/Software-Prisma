<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout-admin :: head-admin('Empresa')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout-admin :: topo-admin}"></nav>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1"
                        th:text="${empresa.id != null ? 'Editar Empresa' : 'Nova Empresa'}">Empresa</h1>
                    <p class="text-body-secondary mb-0">Informe os dados da empresa.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/empresas}">Voltar</a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="${empresa.id != null ? '/empresas/' + empresa.id : '/empresas'}"
                          th:object="${empresa}"
                          method="post"
                          novalidate>

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                            <input id="nome" type="text" class="form-control"
                                   th:field="*{nome}"
                                   placeholder="Nome da empresa"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('nome')}"
                                 th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="cnpj" class="form-label">CNPJ</label>
                            <input id="cnpj" type="text" class="form-control"
                                   th:field="*{cnpj}"
                                   placeholder="00.000.000/0000-00 (opcional)"
                                   th:classappend="${#fields.hasErrors('cnpj')} ? 'is-invalid'">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('cnpj')}"
                                 th:errors="*{cnpj}"></div>
                        </div>

                        <div class="mb-4" th:if="${empresa.id != null}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="ativo"
                                       th:field="*{ativo}">
                                <label class="form-check-label" for="ativo">Empresa ativa</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-2"></i>Salvar
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/empresas}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout-admin :: scripts-admin}"></script>
</body>
</html>
