<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout-admin :: head-admin('Empresas')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout-admin :: topo-admin}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h4 mb-1">Empresas</h1>
            <p class="text-body-secondary mb-0">Cadastro e gerenciamento das empresas do sistema.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/empresas/nova}">
            <i class="bi bi-plus-lg me-2"></i>Nova Empresa
        </a>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
    <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(empresas)}" class="p-4 text-center text-body-secondary">
                <i class="bi bi-building fs-1 d-block mb-3"></i>
                Nenhuma empresa cadastrada.
                <div class="mt-3">
                    <a class="btn btn-primary" th:href="@{/empresas/nova}">
                        <i class="bi bi-plus-lg me-2"></i>Cadastrar primeira empresa
                    </a>
                </div>
            </div>

            <div th:unless="${#lists.isEmpty(empresas)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CNPJ</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="empresa : ${empresas}">
                        <td th:text="${empresa.nome}">Nome</td>
                        <td th:text="${empresa.cnpj != null ? empresa.cnpj : '—'}">CNPJ</td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:class="${empresa.ativo ? 'text-bg-success' : 'text-bg-secondary'}"
                                  th:text="${empresa.ativo ? 'Ativa' : 'Inativa'}">
                                Status
                            </span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-1">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/empresas/{id}/editar(id=${empresa.id})}"
                                   title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:if="${empresa.ativo}"
                                      th:action="@{/empresas/{id}/desativar(id=${empresa.id})}"
                                      method="post"
                                      onsubmit="return confirm('Deseja desativar esta empresa?');">
                                    <button type="submit" class="btn btn-sm btn-outline-warning" title="Desativar">
                                        <i class="bi bi-pause-circle"></i>
                                    </button>
                                </form>
                                <form th:unless="${empresa.ativo}"
                                      th:action="@{/empresas/{id}/ativar(id=${empresa.id})}"
                                      method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-success" title="Ativar">
                                        <i class="bi bi-play-circle"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout-admin :: scripts-admin}"></script>
</body>
</html>
