<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Histórico de Análises')}"></head>

<body class="bg-body-tertiary">
    <nav th:replace="~{fragments/layout :: topo}"></nav>
    <div th:replace="~{fragments/layout :: modal}"></div>

    <main class="container pb-5">
        <div class="mb-4">
            <h1 class="h3 mb-1">Histórico de Análises</h1>
            <p class="text-body-secondary mb-0">Todas as análises realizadas no sistema</p>
        </div>

        <!-- Filtros -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/historico}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="area" class="form-label">Área</label>
                        <select id="area" name="area" class="form-select">
                            <option value="">Todas</option>
                            <option value="ELETRICA" th:selected="${area == 'ELETRICA'}">Elétrica</option>
                            <option value="CIVIL" th:selected="${area == 'CIVIL'}">Civil</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="resultado" class="form-label">Resultado</label>
                        <select id="resultado" name="resultado" class="form-select">
                            <option value="">Todos</option>
                            <option value="ATENDE" th:selected="${resultado == 'ATENDE'}">Atendeu</option>
                            <option value="NAO_ATENDE" th:selected="${resultado == 'NAO_ATENDE'}">Não Atendeu</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="ordenarPor" class="form-label">Ordenar por</label>
                        <select id="ordenarPor" name="ordenarPor" class="form-select">
                            <option value="data" th:selected="${ordenarPor == 'data'}">Data (mais recente)</option>
                            <option value="resultado" th:selected="${ordenarPor == 'resultado'}">Resultado</option>
                            <option value="area" th:selected="${ordenarPor == 'area'}">Área</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">Filtrar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela de Análises -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(analises)}" class="p-4 text-center text-body-secondary">
                    Nenhuma análise encontrada.
                </div>
                <div th:unless="${#lists.isEmpty(analises)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Data</th>
                                <th>Área</th>
                                <th>Resultado</th>
                                <th>Cobertura</th>
                                <th>Itens</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="analise : ${analises}">
                                <td>Análise #<span th:text="${analise.id}">1</span></td>
                                <td th:text="${#temporals.format(analise.dataCriacao, 'dd/MM/yyyy HH:mm', #java.time.ZoneId.of('America/Sao_Paulo'))}">01/01/2024</td>
                                <td th:text="${analise.area == T(br.com.softwareprisma.licitacao.domain.enums.Area).ELETRICA ? 'Elétrica' : 'Civil'}">Área</td>
                                <td>
                                    <span class="badge"
                                        th:class="${analise.resultado == T(br.com.softwareprisma.licitacao.domain.enums.ResultadoAnalise).ATENDE ? 'bg-success' : 'bg-danger'}"
                                        th:text="${analise.resultado == T(br.com.softwareprisma.licitacao.domain.enums.ResultadoAnalise).ATENDE ? 'Atendeu' : 'Não Atendeu'}">
                                        Resultado
                                    </span>
                                </td>
                                <td th:text="${analise.cobertura != null ? #numbers.formatDecimal(analise.cobertura.multiply(1), 1, 'POINT', 2, 'COMMA') + '%' : '-'}">0%</td>
                                <td th:text="${#lists.size(analise.itens)}">0</td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-primary me-1"
                                        th:href="@{/analises/{id}/resumo(id=${analise.id})}">
                                        Visualizar
                                    </a>
                                    <form th:action="@{/historico/{id}/excluir(id=${analise.id})}" method="post" 
                                          class="d-inline" onsubmit="return confirm('Tem certeza que deseja excluir esta análise?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <nav th:if="${!#lists.isEmpty(analises)}" class="d-flex justify-content-between align-items-center p-3 border-top">
                    <div class="text-body-secondary">
                        Página <span th:text="${pagina.number + 1}">1</span> de <span th:text="${pagina.totalPages}">1</span>
                    </div>
                    <ul class="pagination mb-0">
                        <li class="page-item" th:class="${!pagina.hasPrevious() ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/historico(pagina=${pagina.number - 1}, ordenarPor=${ordenarPor}, area=${area}, resultado=${resultado})}" th:if="${pagina.hasPrevious()}">Anterior</a>
                            <span class="page-link" th:if="${!pagina.hasPrevious()}">Anterior</span>
                        </li>
                        <li class="page-item" th:class="${!pagina.hasNext() ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/historico(pagina=${pagina.number + 1}, ordenarPor=${ordenarPor}, area=${area}, resultado=${resultado})}" th:if="${pagina.hasNext()}">Próxima</a>
                            <span class="page-link" th:if="${!pagina.hasNext()}">Próxima</span>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <script th:replace="~{fragments/layout :: scripts}"></script>
</body>

</html>
