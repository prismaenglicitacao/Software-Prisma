<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout-empresa-admin :: head(${vinculo == null ? 'Novo usuário' : 'Editar usuário'})}" />
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout-empresa-admin :: topo}" />
<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="prisma-page-header mb-4">
                <div>
                    <h1 class="h3 mb-1" th:text="${vinculo == null ? 'Novo usuário' : 'Editar usuário'}">Usuário</h1>
                    <p class="text-body-secondary mb-0" th:text="${empresa.nome}">Empresa</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/empresa-admin/usuarios}">Voltar</a>
            </div>

            <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="${vinculo == null ? '/empresa-admin/usuarios' : '/empresa-admin/usuarios/' + vinculo.usuario.id}" th:object="${usuarioForm}" method="post">
                        <div class="prisma-section">
                            <div class="prisma-section-header">
                                <h2>1. Dados do usuário</h2>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label class="form-label" for="nome">Nome</label>
                                    <input class="form-control" id="nome" th:field="*{nome}" required>
                                    <div class="text-danger small" th:errors="*{nome}"></div>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label" for="login">Login / e-mail</label>
                                    <input class="form-control" id="login" th:field="*{login}" th:readonly="${vinculo != null}" required>
                                    <div class="text-danger small" th:errors="*{login}"></div>
                                </div>
                                <div class="col-md-12" th:if="${vinculo == null}">
                                    <label class="form-label" for="senha">Senha</label>
                                    <input class="form-control" id="senha" type="password" th:field="*{senha}" required>
                                    <div class="text-danger small" th:errors="*{senha}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="prisma-section mt-4" th:if="${vinculo == null}">
                            <div class="prisma-section-header">
                                <h2>2. Perfil na empresa</h2>
                            </div>
                            <div class="row g-3 align-items-end">
                                <div class="col-md-12">
                                    <label class="form-label" for="perfil">Tipo de acesso</label>
                                    <select class="form-select" id="perfil" th:field="*{perfil}">
                                        <option th:each="perfil : ${perfis}" th:value="${perfil}" th:text="${perfil == T(br.com.softwareprisma.licitacao.domain.enums.PerfilEmpresa).ADMIN_EMPRESA ? 'Administrador da empresa' : 'Usuário'}"></option>
                                    </select>
                                    <div class="form-text">Usuário: pode acessar normalmente. Administrador: pode administrar usuários e acessos desta empresa.</div>
                                </div>
                            </div>
                        </div>

                        <div class="prisma-section mt-4" th:if="${vinculo != null}">
                            <div class="prisma-section-header">
                                <h2>2. Status do acesso</h2>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" id="ativo" type="checkbox" th:field="*{ativo}">
                                <label class="form-check-label" for="ativo">Usuário ativo nesta empresa</label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center gap-2 mt-4 pt-3 border-top">
                            <a class="btn btn-outline-secondary" th:href="@{/empresa-admin/usuarios}">Cancelar</a>
                            <button class="btn btn-primary" type="submit">Salvar alterações</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm mt-4" th:if="${vinculo != null}">
                <div class="card-body p-4">
                    <h2 class="h5">Alterar senha</h2>
                    <form th:action="@{/empresa-admin/usuarios/{id}/senha(id=${vinculo.usuario.id})}" method="post" class="d-flex gap-2 flex-wrap">
                        <input class="form-control" type="password" name="novaSenha" placeholder="Nova senha" required>
                        <button class="btn btn-warning" type="submit">Salvar senha</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script th:replace="~{fragments/layout-empresa-admin :: scripts}" />
</body>
</html>
