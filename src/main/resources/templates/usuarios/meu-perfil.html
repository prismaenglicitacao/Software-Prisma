<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meu Perfil')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: topo}"></nav>
<div th:replace="~{fragments/layout :: modal}"></div>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Meu Perfil</h1>
                    <p class="text-body-secondary mb-0">Visualize e edite suas informações.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/}">Voltar</a>
            </div>

            <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/meu-perfil}" th:object="${usuario}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input id="nome" type="text" class="form-control"
                                   th:field="*{nome}" placeholder="Nome completo">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="login" class="form-label">Login</label>
                            <input id="login" type="text" class="form-control"
                                   th:field="*{login}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Perfil</label>
                            <div class="form-control-plaintext">
                                <span class="badge rounded-pill"
                                      th:class="${usuario.administrador ? 'text-bg-primary' : 'text-bg-secondary'}"
                                      th:text="${usuario.administrador ? 'Administrador' : 'Usuário'}">
                                    Perfil
                                </span>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
