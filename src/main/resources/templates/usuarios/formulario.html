<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${tituloPagina})}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: topo}"></nav>
<div th:replace="~{fragments/layout :: modal}"></div>

<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1" th:text="${tituloPagina}">Formulario</h1>
                    <p class="text-body-secondary mb-0">Informe os dados do usuário.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Voltar</a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{${acaoFormulario}}" th:object="${usuario}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input id="nome" type="text" class="form-control"
                                   th:field="*{nome}" placeholder="Nome completo">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="login" class="form-label">Login</label>
                            <input id="login" type="text" class="form-control"
                                   th:field="*{login}" placeholder="Login de acesso">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></div>
                        </div>

                        <div class="mb-3" th:if="${usuario.id == null}">
                            <label for="senha" class="form-label">Senha</label>
                            <div class="input-group">
                                <input id="senha" type="password" class="form-control"
                                       th:field="*{senha}" placeholder="Senha">
                                <button type="button" class="btn btn-outline-secondary toggle-password" data-target="senha">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="administrador" th:field="*{administrador}">
                                <label class="form-check-label" for="administrador">
                                    Administrador
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
                                <label class="form-check-label" for="ativo">
                                    Ativo
                                </label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>

            <div th:if="${usuario.id != null}" class="card shadow-sm mt-4">
                <div class="card-body p-4">
                    <h5 class="h5 mb-3">Resetar Senha</h5>
                    <form th:action="@{/usuarios/{id}/resetar-senha(id=${usuario.id})}" method="post">
                        <div class="mb-3">
                            <label for="novaSenhaReset" class="form-label">Nova Senha</label>
                            <div class="input-group">
                                <input id="novaSenhaReset" type="password" class="form-control" name="novaSenha" required>
                                <button type="button" class="btn btn-outline-secondary toggle-password" data-target="novaSenhaReset">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning">Resetar Senha</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/password-toggle :: password-toggle}"></script>
</body>
</html>
