<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout :: topo}"></nav>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Usuários</h1>
            <p class="text-body-secondary mb-0">Gerenciamento de usuários do sistema</p>
        </div>
        <a class="btn btn-primary" th:href="@{/usuarios/novo}">Novo Usuário</a>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
    <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(usuarios)}" class="p-4 text-center text-body-secondary">
                Nenhum usuário cadastrado.
            </div>

            <div th:unless="${#lists.isEmpty(usuarios)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>Perfil</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nome}">Nome</td>
                        <td th:text="${usuario.login}">Login</td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:class="${usuario.administrador ? 'text-bg-primary' : 'text-bg-secondary'}"
                                  th:text="${usuario.administrador ? 'Administrador' : 'Usuário'}">
                                Perfil
                            </span>
                        </td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:class="${usuario.ativo ? 'text-bg-success' : 'text-bg-secondary'}"
                                  th:text="${usuario.ativo ? 'Ativo' : 'Inativo'}">
                                Status
                            </span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">
                                    Editar
                                </a>
                                <form th:action="@{/usuarios/{id}/alternar-ativo(id=${usuario.id})}" method="post"
                                      onsubmit="return confirm('Deseja realmente alterar o status deste usuário?');">
                                    <button type="submit" class="btn btn-sm btn-outline-warning"
                                            th:text="${usuario.ativo ? 'Desativar' : 'Ativar'}">
                                        Alterar
                                    </button>
                                </form>
                                <form th:action="@{/usuarios/{id}/excluir(id=${usuario.id})}" method="post"
                                      onsubmit="return confirm('Deseja realmente excluir este usuário?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        Excluir
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
