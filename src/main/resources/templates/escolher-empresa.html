<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha a Empresa - Software Prisma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/prisma.css}" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Sem acesso (usuário comum sem vínculo) -->
                <div th:if="${semAcesso}" class="text-center">
                    <i class="bi bi-building-x fs-1 text-danger mb-3 d-block"></i>
                    <h1 class="h4 mb-2">Sem acesso a empresas</h1>
                    <p class="text-body-secondary mb-4">
                        Seu usuário não possui vínculo ativo com nenhuma empresa.<br>
                        Entre em contato com o administrador do sistema.
                    </p>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-secondary">
                            <i class="bi bi-box-arrow-left me-2"></i>
                            Voltar ao login
                        </button>
                    </form>
                </div>

                <!-- Escolha de empresa -->
                <div th:unless="${semAcesso}">
                    <div class="text-center mb-4">
                        <i class="bi bi-building fs-1 d-block mb-2" style="color: var(--prisma-blue);"></i>
                        <h1 class="h4 mb-1">Software Prisma</h1>
                        <p class="text-body-secondary mb-0">Selecione a empresa que deseja acessar</p>
                    </div>

                    <!-- Admin sem empresas disponíveis (empresas existem mas sem vínculo) -->
                    <div th:if="${empresas != null and #lists.isEmpty(empresas)}" class="text-center">
                        <div class="alert alert-warning mb-4">
                            Nenhuma empresa disponível para seleção.
                        </div>
                        <a th:href="@{/empresas}" class="btn btn-primary me-2">
                            <i class="bi bi-building me-2"></i>Gerenciar Empresas
                        </a>
                        <a th:href="@{/empresas/nova}" class="btn btn-outline-primary">
                            <i class="bi bi-plus-lg me-2"></i>Cadastrar Empresa
                        </a>
                    </div>

                    <!-- Lista de empresas -->
                    <div class="row g-3" th:unless="${empresas == null or #lists.isEmpty(empresas)}">
                        <div class="col-sm-6" th:each="empresa : ${empresas}">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                                    <i class="bi bi-building fs-2 mb-3" style="color: var(--prisma-blue);"></i>
                                    <h2 class="h5 mb-3" th:text="${empresa.nome}">Empresa</h2>
                                    <form th:action="@{/empresa-ativa/selecionar}" method="post" class="w-100">
                                        <input type="hidden" name="empresaId" th:value="${empresa.id}">
                                        <button type="submit" class="btn btn-primary w-100">
                                            <i class="bi bi-box-arrow-in-right me-2"></i>
                                            Entrar
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-link btn-sm text-body-secondary">
                                <i class="bi bi-box-arrow-left me-1"></i>
                                Sair e voltar ao login
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
