<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - Software Prisma</title>
    
    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Prisma Custom CSS -->
    <link th:href="@{/css/prisma.css}" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg">
                    <div class="card-body p-4 text-center">
                        <div class="mb-4">
                            <i class="bi bi-exclamation-triangle fs-1" style="color: var(--prisma-orange);"></i>
                        </div>
                        
                        <h1 class="h4 mb-3">Erro Inesperado</h1>
                        
                        <p class="text-body-secondary mb-4" th:text="${errorMessage ?: 'Ocorreu um erro inesperado. Por favor, tente novamente.'}">
                            Ocorreu um erro inesperado. Por favor, tente novamente.
                        </p>
                        
                        <div class="d-grid">
                            <a th:href="@{/}" class="btn btn-primary">
                                <i class="bi bi-house me-2"></i>
                                Voltar para a Página Inicial
                            </a>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-3 text-body-secondary">
                    <small>© 2024 Prisma Empreendimentos</small>
                </div>
            </div>
        </div>
</body>
</html>
