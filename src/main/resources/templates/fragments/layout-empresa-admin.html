<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Administração da empresa'">Administração da empresa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link th:href="@{/css/prisma.css}" rel="stylesheet">
</head>
<nav th:fragment="topo" class="navbar navbar-expand-lg navbar-dark mb-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/empresa-admin}">
            <i class="bi bi-person-gear"></i>
            <span>Administração da empresa</span>
        </a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span><i class="bi bi-building me-1"></i>Empresa ativa: <strong th:text="${empresa.nome}">Empresa</strong></span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/}"><i class="bi bi-arrow-left me-1"></i>Sistema</a>
        </div>
    </div>
</nav>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
