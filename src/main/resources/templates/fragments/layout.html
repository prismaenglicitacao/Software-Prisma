<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<body>

    <head th:fragment="head(titulo)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${titulo} + ' | Software Prisma'">Software Prisma</title>
        
        <!-- Fonte Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <!-- Prisma Custom CSS -->
        <link th:href="@{/css/prisma.css}" rel="stylesheet">
        
        <!-- Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    </head>

  <nav th:fragment="topo"
     class="navbar navbar-expand-lg navbar-dark mb-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-building"></i>
                <span>Software Prisma</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link d-flex align-items-center gap-2" th:href="@{/}">
                        <i class="bi bi-speedometer2"></i>
                        <span>Dashboard</span>
                    </a>
                    <a class="nav-link d-flex align-items-center gap-2" th:href="@{/engenheiros}">
                        <i class="bi bi-person-badge"></i>
                        <span>Engenheiros</span>
                    </a>
                    <a class="nav-link d-flex align-items-center gap-2" th:href="@{/cats}">
                        <i class="bi bi-file-earmark-text"></i>
                        <span>CATs</span>
                    </a>
                    <div class="nav-item dropdown">
                        <a class="nav-link d-flex align-items-center gap-2 dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-graph-up"></i>
                            <span>Análises</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2" th:href="@{/analises/nova}">
                                    <i class="bi bi-plus-circle"></i>
                                    <span>Nova Análise</span>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2" th:href="@{/historico}">
                                    <i class="bi bi-clock-history"></i>
                                    <span>Histórico</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                    <a class="nav-link d-flex align-items-center gap-2" th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-people"></i>
                        <span>Usuários</span>
                    </a>
                </div>
                <div class="navbar-nav ms-auto d-flex align-items-center gap-3">
                    <div class="position-relative">
                        <input type="text" 
                               class="form-control form-control-sm" 
                               style="width: 200px; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white;"
                               placeholder="Pesquisar... (Ctrl+K)"
                               id="globalSearchInput"
                               autocomplete="off">
                        <kbd class="position-absolute top-50 end-0 translate-middle-y me-2 bg-secondary border-0" style="font-size: 10px; opacity: 0.7;">⌘K</kbd>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i>
                            <span sec:authentication="name">Usuário</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item d-flex align-items-center gap-2" th:href="@{/meu-perfil}">
                                <i class="bi bi-person"></i>
                                <span>Meu Perfil</span>
                            </a></li>
                            <li><a class="dropdown-item d-flex align-items-center gap-2" th:href="@{/alterar-senha}">
                                <i class="bi bi-key"></i>
                                <span>Alterar Senha</span>
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <button type="submit" class="dropdown-item d-flex align-items-center gap-2">
                                        <i class="bi bi-box-arrow-right"></i>
                                        <span>Sair</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Modal de Pesquisa Global -->
    <div th:fragment="modal" class="modal fade" id="globalSearchModal" tabindex="-1" aria-labelledby="globalSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-body p-0">
                    <div class="p-3 border-bottom">
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-0">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                                </svg>
                            </span>
                            <input type="text" 
                                   class="form-control border-0 fs-5" 
                                   placeholder="Pesquisar engenheiros, CATs, itens..." 
                                   id="modalSearchInput"
                                   autocomplete="off">
                            <kbd class="input-group-text bg-transparent border-0" style="font-size: 12px;">ESC</kbd>
                        </div>
                    </div>
                    <div id="searchResults" class="p-3" style="max-height: 500px; overflow-y: auto;">
                        <div class="text-center text-muted py-5">
                            <p class="mb-0">Digite para pesquisar...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

   <th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/global-search.js}"></script>
</th:block>
</body>

</html>
