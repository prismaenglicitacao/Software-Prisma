<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<body>

<head th:fragment="head-admin(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Admin — Software Prisma'">Admin — Software Prisma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/prisma.css}" rel="stylesheet">
</head>

<nav th:fragment="topo-admin" class="prisma-shell prisma-shell-admin" aria-label="Navegação administrativa">
    <aside class="prisma-sidebar prisma-sidebar-admin" id="prismaSidebarAdmin">
        <div class="prisma-sidebar-header">
            <a class="prisma-brand-side" th:href="@{/admin}">
                <span class="prisma-brand-mark"><i class="bi bi-shield-lock"></i></span>
                <span class="prisma-brand-text">Software Prisma</span>
            </a>
        </div>

        <div class="prisma-sidebar-nav">
            <div class="prisma-sidebar-section">
                <span class="prisma-sidebar-label">Sistema</span>
                <a class="prisma-sidebar-link" th:href="@{/admin}" data-route="/admin">
                    <i class="bi bi-speedometer2"></i>
                    <span>Painel</span>
                </a>
                <a class="prisma-sidebar-link" th:href="@{/empresas}" data-route="/empresas">
                    <i class="bi bi-building-gear"></i>
                    <span>Empresas</span>
                </a>
                <a class="prisma-sidebar-link" th:href="@{/usuarios}" data-route="/usuarios">
                    <i class="bi bi-people"></i>
                    <span>Usuários</span>
                </a>
                <a class="prisma-sidebar-link" th:href="@{/admin/vinculos}" data-route="/admin/vinculos">
                    <i class="bi bi-link-45deg"></i>
                    <span>Vínculos</span>
                </a>
            </div>
        </div>

        <div class="prisma-sidebar-footer">
            <div class="prisma-user-summary">
                <span class="prisma-user-avatar">
                    <i class="bi bi-person-circle"></i>
                </span>
                <div class="prisma-user-meta">
                    <span class="prisma-user-name" sec:authentication="name">Admin</span>
                    <small>ADMIN_SISTEMA</small>
                </div>
            </div>
            <div class="prisma-user-actions">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="prisma-sidebar-action danger">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Sair</span>
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <div class="prisma-sidebar-backdrop" id="prismaSidebarBackdropAdmin"></div>

    <header class="prisma-topbar-modern prisma-topbar-admin">
        <div class="prisma-topbar-left">
            <button type="button" class="prisma-sidebar-toggle" id="prismaSidebarToggleAdmin" aria-label="Alternar menu lateral">
                <i class="bi bi-list"></i>
            </button>
        </div>

        <div class="prisma-topbar-right">
            <div class="prisma-identity-badge">
                <span class="meta-label">Usuário</span>
                <span class="meta-value" sec:authentication="name">Admin</span>
            </div>

            <div class="dropdown prisma-user-menu">
                <button class="btn btn-prisma-soft dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="prisma-user-avatar small"><i class="bi bi-person-circle"></i></span>
                    <span>Conta</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="dropdown-item d-flex align-items-center gap-2">
                                <i class="bi bi-box-arrow-right"></i>
                                <span>Sair</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </header>
</nav>

<th:block th:fragment="scripts-admin">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const shell = document.querySelector('.prisma-shell-admin');
            if (!shell) return;

            const toggle = document.getElementById('prismaSidebarToggleAdmin');
            const sidebar = document.getElementById('prismaSidebarAdmin');
            const STORAGE_KEY = 'prisma-sidebar-admin-collapsed';

            const applyTooltip = () => {
                document.querySelectorAll('.prisma-sidebar-link, .prisma-sidebar-action').forEach((item) => {
                    const text = item.innerText.replace(/\s+/g, ' ').trim();
                    item.setAttribute('data-tooltip', text);
                });
            };

            const applyActiveState = () => {
                const path = window.location.pathname;
                document.querySelectorAll('.prisma-sidebar-link').forEach((link) => {
                    const route = link.dataset.route || '';
                    const matches = route === '/' ? path === '/' : path.startsWith(route);
                    link.classList.toggle('active', matches);
                });
            };

            const applyCollapsedState = () => {
                const collapsed = localStorage.getItem(STORAGE_KEY) === 'true';
                shell.classList.toggle('collapsed', collapsed);
                if (sidebar) {
                    sidebar.classList.toggle('collapsed', collapsed);
                }
            };

            const setCollapsed = (collapsed) => {
                shell.classList.toggle('collapsed', collapsed);
                if (sidebar) {
                    sidebar.classList.toggle('collapsed', collapsed);
                }
                localStorage.setItem(STORAGE_KEY, String(collapsed));
            };

            applyTooltip();
            applyActiveState();
            applyCollapsedState();

            if (toggle) {
                toggle.addEventListener('click', function() {
                    if (window.innerWidth < 992) {
                        shell.classList.toggle('sidebar-open');
                        return;
                    }
                    setCollapsed(!shell.classList.contains('collapsed'));
                });
            }

            const backdrop = document.getElementById('prismaSidebarBackdropAdmin');
            if (backdrop) {
                backdrop.addEventListener('click', function() {
                    shell.classList.remove('sidebar-open');
                });
            }
        })();
    </script>
</th:block>

</body>
</html>
