<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout-admin :: head-admin('Painel')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/layout-admin :: topo-admin}"></nav>

<main class="container pb-5">
    <div class="mb-4">
        <h1 class="h4 mb-1">Painel Administrativo</h1>
        <p class="text-body-secondary mb-0">Gerencie empresas, usuários e vínculos do sistema.</p>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
    <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-building fs-2" style="color: var(--prisma-blue);"></i>
                    <div>
                        <div class="text-body-secondary small">Empresas cadastradas</div>
                        <div class="fs-3 fw-bold" th:text="${totalEmpresas}">0</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent d-flex gap-2">
                    <a th:href="@{/empresas}" class="btn btn-sm btn-outline-primary">Gerenciar</a>
                    <a th:href="@{/empresas/nova}" class="btn btn-sm btn-primary">Nova Empresa</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-people fs-2" style="color: var(--prisma-blue);"></i>
                    <div>
                        <div class="text-body-secondary small">Usuários cadastrados</div>
                        <div class="fs-3 fw-bold" th:text="${totalUsuarios}">0</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent d-flex gap-2">
                    <a th:href="@{/usuarios}" class="btn btn-sm btn-outline-primary">Gerenciar</a>
                    <a th:href="@{/usuarios/novo}" class="btn btn-sm btn-primary">Novo Usuário</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-link-45deg fs-2" style="color: var(--prisma-blue);"></i>
                    <div>
                        <div class="text-body-secondary small">Vínculos ativos</div>
                        <div class="fs-3 fw-bold" th:text="${totalVinculos}">0</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/admin/vinculos}" class="btn btn-sm btn-outline-primary">Gerenciar Vínculos</a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${empresasSemVinculos != null and !empresasSemVinculos.isEmpty()}" class="alert alert-warning">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <strong th:text="${empresasSemVinculos.size()}">0</strong> empresa(s) sem usuários vinculados:
        <span th:each="e, i : ${empresasSemVinculos}">
            <strong th:text="${e.nome}"></strong><span th:if="${!i.last}">, </span>
        </span>
    </div>
</main>

<script th:replace="~{fragments/layout-admin :: scripts-admin}"></script>
</body>
</html>
